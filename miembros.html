<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCC - Listado de Miembros</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <div class="contenedor">
      <h1>DCC — Calidad de Vida</h1>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="registro.html">Registrar Miembro</a></li>
          <li><a href="actividades.html">Registrar Actividad</a></li>
          <li><a href="miembros.html">Listado de Miembros</a></li>
          <li><a href="metricas.html">Métricas</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="contenedor">

      <h2>Listado de Miembros</h2>

      <section>
        <h3>Filtrar</h3>
        <div class="controles">

          <div class="campo">
            <label for="filtro-tipo">Tipo de miembro</label>
            <select id="filtro-tipo">
              <option value="">Todos</option>
              <option value="pregrado">Estudiante pregrado</option>
              <option value="postgrado">Estudiante postgrado</option>
              <option value="funcionario">Funcionario/a</option>
              <option value="academico">Académico/a</option>
            </select>
          </div>

          <button class="btn btn-primario" id="btn-aplicar">Aplicar</button>

        </div>
      </section>

      <section>
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>RUT</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Tipo</th>
            </tr>
          </thead>
          <tbody id="tabla-cuerpo">
            <!-- Filas generadas por JS -->
          </tbody>
        </table>

        <nav class="paginacion">
          <button class="btn btn-secundario" id="btn-anterior">Anterior</button>
          <span id="info-pagina">Página 1 de 1</span>
          <button class="btn btn-secundario" id="btn-siguiente">Siguiente</button>
        </nav>
      </section>

    </div>
  </main>

  <footer>
    <p>Departamento de Ciencias de la Computación — Universidad de Chile</p>
  </footer>

  <script src="js/miembros.js"></script>
</body>
</html>
